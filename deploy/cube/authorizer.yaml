apiVersion: v1
kind: ServiceAccount
metadata:
  name: dsh-cloud-cube-api-authorizer
  namespace: cube-system
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dsh-cloud-cube-api-authorizer
  namespace: cube-system
  labels:
    app.kubernetes.io/name: dsh-cloud-cube-api-authorizer
    app.kubernetes.io/component: cube-api-authorizer
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels:
      app.kubernetes.io/name: dsh-cloud-cube-api-authorizer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dsh-cloud-cube-api-authorizer
        app.kubernetes.io/component: cube-api-authorizer
    spec:
      serviceAccountName: dsh-cloud-cube-api-authorizer
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 5
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: authorizer
          image: dsh-cloud/cube-api-authorizer:local
          imagePullPolicy: Never
          env:
            - name: DSH_CLOUD_CUBE_API_AUTH_CREDENTIAL_FILE
              value: /run/dsh-cloud-secrets/api-key
          ports:
            - { name: http, containerPort: 8080 }
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 3
            failureThreshold: 10
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: 10m, memory: 24Mi }
            limits: { cpu: 250m, memory: 64Mi }
          volumeMounts:
            - name: credential
              mountPath: /run/dsh-cloud-secrets/api-key
              subPath: api-key
              readOnly: true
            - { name: temporary, mountPath: /tmp }
      volumes:
        - name: credential
          secret:
            secretName: dsh-cloud-cube-api-credential
            defaultMode: 288
        - name: temporary
          emptyDir: { medium: Memory, sizeLimit: 8Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: dsh-cloud-cube-api-authorizer
  namespace: cube-system
spec:
  selector:
    app.kubernetes.io/name: dsh-cloud-cube-api-authorizer
  ports:
    - { name: http, port: 8080, targetPort: http }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dsh-cloud-cube-api-authorizer
  namespace: cube-system
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: dsh-cloud-cube-api-authorizer
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: api
      ports:
        - { protocol: TCP, port: 8080 }
