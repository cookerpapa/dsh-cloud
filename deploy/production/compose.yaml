name: dsh-cloud

x-worker-environment: &worker-environment
  DSH_CLOUD_DATABASE_URL: postgresql://dsh_cloud:${POSTGRES_PASSWORD}@postgres:5432/dsh_cloud
  DSH_CLOUD_NAMESPACE: ${DSH_CLOUD_NAMESPACE:-production}
  DSH_CLOUD_HOST: 127.0.0.1
  DSH_CLOUD_PORT: 3081
  DSH_CLOUD_WORKER_CONTROL_HOST: 0.0.0.0
  DSH_CLOUD_WORKER_CONTROL_PORT: 3080
  DSH_CLOUD_WORKER_SLOTS: ${DSH_CLOUD_WORKER_SLOTS:-4}
  DSH_CLOUD_WORKER_DRAIN_TIMEOUT_MS: ${DSH_CLOUD_WORKER_DRAIN_TIMEOUT_MS:-540000}
  DSH_CLOUD_RUN_LEASE_SECONDS: ${DSH_CLOUD_RUN_LEASE_SECONDS:-20}
  DSH_CLOUD_PROMPT_PERSIST_TIMEOUT_MS: ${DSH_CLOUD_PROMPT_PERSIST_TIMEOUT_MS:-30000}
  DSH_CLOUD_TOOL_BROKER_URL: http://tool-broker:3090
  DSH_CLOUD_TOOL_BROKER_TOKEN: ${DSH_CLOUD_TOOL_BROKER_TOKEN:?tool broker token is required}
  DSH_CLOUD_KAFKA_BROKERS: kafka:9092
  DSH_CLOUD_KAFKA_SESSION_TOPIC: ${DSH_CLOUD_KAFKA_SESSION_TOPIC:-dsh-cloud-session-events-v2}
  DSH_CLOUD_KAFKA_PARTITIONS: ${DSH_CLOUD_KAFKA_PARTITIONS:-12}
  DSH_CLOUD_KAFKA_REPLICATION_FACTOR: ${DSH_CLOUD_KAFKA_REPLICATION_FACTOR:-1}
  DSH_CLOUD_KAFKA_EVENT_RETENTION_MS: ${DSH_CLOUD_KAFKA_EVENT_RETENTION_MS:-2592000000}
  DSH_CLOUD_VALKEY_URL: redis://valkey:6379
  DSH_CLOUD_LIVE_EVENT_RETENTION_SECONDS: ${DSH_CLOUD_LIVE_EVENT_RETENTION_SECONDS:-86400}
  DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:?DeepSeek API key is required}
  DSH_HOME: /var/lib/dsh

x-worker-healthcheck: &worker-healthcheck
  test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:9090/metrics').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
  interval: 5s
  timeout: 3s
  retries: 30

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: dsh_cloud
      POSTGRES_USER: dsh_cloud
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dsh_cloud -d dsh_cloud"]
      interval: 2s
      timeout: 2s
      retries: 30
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [platform]

  kafka:
    image: apache/kafka:4.1.1
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server 127.0.0.1:9092 --list >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks: [platform]

  valkey:
    image: valkey/valkey:8.1-alpine
    restart: unless-stopped
    command: ["valkey-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30
    volumes:
      - valkey-data:/data
    networks: [platform]

  tool-broker:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.services
      target: tool-broker
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      DSH_CLOUD_DATABASE_URL: postgresql://dsh_cloud:${POSTGRES_PASSWORD}@postgres:5432/dsh_cloud
      DSH_CLOUD_NAMESPACE: ${DSH_CLOUD_NAMESPACE:-production}
      DSH_CLOUD_TOOL_BROKER_TOKEN: ${DSH_CLOUD_TOOL_BROKER_TOKEN:?tool broker token is required}
      DSH_CLOUD_SANDBOX_ENCRYPTION_KEY: ${DSH_CLOUD_SANDBOX_ENCRYPTION_KEY:?encryption key is required}
      DSH_CLOUD_CUBE_API_URL: ${DSH_CLOUD_CUBE_API_URL:?Cube API URL is required}
      DSH_CLOUD_CUBE_API_KEY: ${DSH_CLOUD_CUBE_API_KEY:?Cube API key is required}
      DSH_CLOUD_CUBE_TEMPLATE_ID: ${DSH_CLOUD_CUBE_TEMPLATE_ID:?Cube template id is required}
      DSH_CLOUD_CUBE_PROXY_NODE_IP: ${DSH_CLOUD_CUBE_PROXY_NODE_IP:?Cube proxy address is required}
      DSH_CLOUD_CUBE_PROXY_PORT: ${DSH_CLOUD_CUBE_PROXY_PORT:-80}
      DSH_CLOUD_CUBE_PROXY_SCHEME: ${DSH_CLOUD_CUBE_PROXY_SCHEME:-http}
      DSH_CLOUD_CUBE_DOMAIN: ${DSH_CLOUD_CUBE_DOMAIN:-cube.local}
      DSH_CLOUD_CUBE_EGRESS_PROXY_IP: ${DSH_CLOUD_CUBE_EGRESS_PROXY_IP:?egress proxy IP is required}
      DSH_CLOUD_CUBE_VOLUME_DRIVER: ${DSH_CLOUD_CUBE_VOLUME_DRIVER:-dsh-cloud-posix}
      DSH_CLOUD_SANDBOX_IDLE_TTL_MS: ${DSH_CLOUD_SANDBOX_IDLE_TTL_MS:-1800000}
      DSH_CLOUD_RUN_LEASE_SECONDS: ${DSH_CLOUD_RUN_LEASE_SECONDS:-20}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3090/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks: [platform, cube-control]

  worker-1:
    build: &worker-build
      context: ../..
      dockerfile: deploy/docker/Dockerfile.services
      target: worker
    restart: unless-stopped
    stop_grace_period: 600s
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
      valkey: { condition: service_healthy }
      tool-broker: { condition: service_healthy }
    volumes:
      - worker-1-home:/var/lib/dsh
    networks: [platform]
    environment:
      <<: *worker-environment
      DSH_CLOUD_WORKER_ID: worker-1
      DSH_CLOUD_WORKER_URL: http://worker-1:3080
    healthcheck: *worker-healthcheck

  worker-2:
    build: *worker-build
    restart: unless-stopped
    stop_grace_period: 600s
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
      valkey: { condition: service_healthy }
      tool-broker: { condition: service_healthy }
    volumes:
      - worker-2-home:/var/lib/dsh
    networks: [platform]
    environment:
      <<: *worker-environment
      DSH_CLOUD_WORKER_ID: worker-2
      DSH_CLOUD_WORKER_URL: http://worker-2:3080
    healthcheck: *worker-healthcheck

  gateway:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.services
      target: gateway
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      worker-1: { condition: service_started }
      worker-2: { condition: service_started }
    environment:
      DSH_CLOUD_DATABASE_URL: postgresql://dsh_cloud:${POSTGRES_PASSWORD}@postgres:5432/dsh_cloud
      DSH_CLOUD_NAMESPACE: ${DSH_CLOUD_NAMESPACE:-production}
      DSH_CLOUD_GATEWAY_HOST: 0.0.0.0
      DSH_CLOUD_GATEWAY_PORT: 8080
      DSH_CLOUD_GATEWAY_DB_POOL: ${DSH_CLOUD_GATEWAY_DB_POOL:-20}
      DSH_CLOUD_AGENT_PRESETS: ${DSH_CLOUD_AGENT_PRESETS:-standard,code}
      DSH_CLOUD_SECURE_COOKIES: ${DSH_CLOUD_SECURE_COOKIES:-0}
      DSH_CLOUD_PUBLIC_ORIGIN: ${DSH_CLOUD_PUBLIC_ORIGIN:-}
      DSH_CLOUD_EVENT_PROJECTION_TIMEOUT_MS: ${DSH_CLOUD_EVENT_PROJECTION_TIMEOUT_MS:-90000}
      DSH_CLOUD_TOOL_BROKER_URL: http://tool-broker:3090
      DSH_CLOUD_TOOL_BROKER_TOKEN: ${DSH_CLOUD_TOOL_BROKER_TOKEN:?tool broker token is required}
    ports:
      - "${DSH_CLOUD_HTTP_BIND:-127.0.0.1}:${DSH_CLOUD_HTTP_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks: [platform]

networks:
  platform:
    driver: bridge
  cube-control:
    external: true
    name: ${DSH_CLOUD_CUBE_CONTROL_NETWORK:?Cube control network is required}

volumes:
  postgres-data:
  worker-1-home:
  worker-2-home:
  kafka-data:
  valkey-data:
