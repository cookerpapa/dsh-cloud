images:
  gateway:
    repository: ghcr.io/example/dsh-cloud-gateway
    tag: latest
  worker:
    repository: ghcr.io/example/dsh-cloud-worker
    tag: latest
  toolBroker:
    repository: ghcr.io/example/dsh-cloud-tool-broker
    tag: latest
  pullPolicy: IfNotPresent

namespace: default
publicOrigin: ""
run:
  leaseSeconds: 20
gateway:
  replicas: 2
  dbPool: 20
  agentPresets: "standard,code"
  secureCookies: true
  eventProjectionTimeoutMs: 90000
  service:
    type: ClusterIP
    port: 8080
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: "1", memory: 512Mi }
worker:
  replicas: 2
  slots: 4
  promptPersistenceTimeoutMs: 30000
  drainTimeoutMs: 540000
  terminationGracePeriodSeconds: 600
  resources:
    requests: { cpu: 500m, memory: 1Gi }
    limits: { cpu: "4", memory: 4Gi }
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 100
    queuedRunsPerReplica: "4"
    pollingIntervalSeconds: 2
    cooldownSeconds: 60
  proxy:
    enabled: false
    port: 3128
    httpProxy: ""
    httpsProxy: ""
    noProxy: "127.0.0.1,localhost,.svc,.cluster.local"
toolBroker:
  replicas: 3
  idleTtlMs: 1800000
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: "1", memory: 512Mi }
kafka:
  brokers: "kafka.kafka.svc:9092"
  port: 9092
  topic: dsh-cloud-session-events-v2
  partitions: 48
  replicationFactor: 3
  eventRetentionMs: "2592000000"
valkey:
  url: "redis://valkey.valkey.svc:6379"
  port: 6379
  liveEventRetentionSeconds: 86400

postgres:
  secretName: dsh-cloud-postgres
  urlKey: database-url
sandbox:
  secretName: dsh-cloud-sandbox
  brokerTokenKey: broker-token
  encryptionKeyKey: encryption-key
  cubeApiKeyKey: cube-api-key
  cube:
    apiUrl: http://cube-api.cube-system.svc:3000
    apiPort: 3000
    templateId: ""
    proxyNodeIp: cube-proxy.cube-system.svc
    proxyPort: 80
    proxyScheme: http
    domain: cube.local
    egressProxyIp: 10.255.255.254
    volumeDriver: dsh-cloud-posix
model:
  secretName: dsh-cloud-model
  apiKeyKey: deepseek-api-key

networkPolicy:
  enabled: true
