apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-gateway
  labels:
    {{- include "dsh-cloud.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  replicas: {{ .Values.gateway.replicas }}
  selector: { matchLabels: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: gateway } }
  template:
    metadata:
      labels: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: gateway }
      annotations: { prometheus.io/scrape: "true", prometheus.io/port: "8080", prometheus.io/path: /metrics }
    spec:
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: gateway
          image: {{ include "dsh-cloud.gatewayImage" . }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          ports: [{ name: http, containerPort: 8080 }]
          env:
            - { name: DSH_CLOUD_DATABASE_URL, valueFrom: { secretKeyRef: { name: {{ .Values.postgres.secretName }}, key: {{ .Values.postgres.urlKey }} } } }
            - { name: DSH_CLOUD_NAMESPACE, value: {{ include "dsh-cloud.namespace" . | quote }} }
            - { name: DSH_CLOUD_GATEWAY_PORT, value: "8080" }
            - { name: DSH_CLOUD_SECURE_COOKIES, value: {{ ternary "1" "0" .Values.gateway.secureCookies | quote }} }
            - { name: DSH_CLOUD_EVENT_PROJECTION_TIMEOUT_MS, value: {{ .Values.gateway.eventProjectionTimeoutMs | quote }} }
            - { name: DSH_CLOUD_SANDBOX_MANAGER_URL, value: http://{{ .Release.Name }}-manager:3090 }
            - { name: DSH_CLOUD_SANDBOX_MANAGER_TOKEN, valueFrom: { secretKeyRef: { name: {{ .Values.sandbox.secretName }}, key: {{ .Values.sandbox.managerTokenKey }} } } }
            {{- if .Values.publicOrigin }}
            - { name: DSH_CLOUD_PUBLIC_ORIGIN, value: {{ .Values.publicOrigin | quote }} }
            {{- end }}
          readinessProbe: { httpGet: { path: /health/ready, port: http }, initialDelaySeconds: 3, periodSeconds: 5 }
          livenessProbe: { httpGet: { path: /health/live, port: http }, periodSeconds: 10 }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          resources: {{- toYaml .Values.gateway.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata: { name: {{ .Release.Name }}-gateway }
spec:
  type: {{ .Values.gateway.service.type }}
  selector: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: gateway }
  ports: [{ name: http, port: {{ .Values.gateway.service.port }}, targetPort: http }]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: { name: {{ .Release.Name }}-gateway }
spec:
  minAvailable: 1
  selector: { matchLabels: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: gateway } }
