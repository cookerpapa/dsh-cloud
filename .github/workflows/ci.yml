name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: dsh_cloud
          POSTGRES_USER: dsh_cloud
          POSTGRES_PASSWORD: dsh_cloud
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dsh_cloud -d dsh_cloud"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30
    env:
      DSH_CLOUD_TEST_DATABASE_URL: postgresql://dsh_cloud:dsh_cloud@127.0.0.1:5432/dsh_cloud
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      - run: pnpm test:integration

