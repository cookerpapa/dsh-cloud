name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: dsh_cloud
          POSTGRES_USER: dsh_cloud
          POSTGRES_PASSWORD: dsh_cloud
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dsh_cloud -d dsh_cloud"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30
      kafka:
        image: apache/kafka:4.1.1
        env:
          KAFKA_NODE_ID: 1
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://127.0.0.1:9092
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@127.0.0.1:9093
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
          KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
        ports:
          - 9092:9092
        options: >-
          --health-cmd "/opt/kafka/bin/kafka-topics.sh --bootstrap-server 127.0.0.1:9092 --list"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
      valkey:
        image: valkey/valkey:8.1-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30
    env:
      DSH_CLOUD_TEST_DATABASE_URL: postgresql://dsh_cloud:dsh_cloud@127.0.0.1:5432/dsh_cloud
      DSH_CLOUD_TEST_KAFKA_BROKERS: 127.0.0.1:9092
      DSH_CLOUD_TEST_VALKEY_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: azure/setup-helm@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      - run: pnpm test:integration
      - run: bash -n install.sh deploy/cube/register-template.sh deploy/cube/cube-volume-dsh-cloud-posix.sh
      - run: helm lint deploy/helm/dsh-cloud --set sandbox.cube.templateId=ci-template
      - name: Build production Worker image
        run: docker build -f deploy/docker/Dockerfile.services --target worker -t dsh-cloud-worker:ci .
      - name: Validate production Compose
        env:
          POSTGRES_PASSWORD: ci-postgres-password
          DSH_CLOUD_TOOL_BROKER_TOKEN: ci-tool-broker-token-with-at-least-32-characters
          DSH_CLOUD_SANDBOX_ENCRYPTION_KEY: Y2ktZW5jcnlwdGlvbi1rZXktMzItYnl0ZXMtbG9uZyEhISE=
          DEEPSEEK_API_KEY: ci-model-key
          DSH_CLOUD_CUBE_API_URL: http://cube-api.example.test:3000
          DSH_CLOUD_CUBE_CONTROL_NETWORK: ci-cube-control
          DSH_CLOUD_CUBE_API_KEY: ci-cube-key
          DSH_CLOUD_CUBE_TEMPLATE_ID: ci-template
          DSH_CLOUD_CUBE_PROXY_NODE_IP: 192.0.2.10
          DSH_CLOUD_CUBE_EGRESS_PROXY_IP: 192.0.2.11
        run: docker compose -f deploy/production/compose.yaml config --quiet
