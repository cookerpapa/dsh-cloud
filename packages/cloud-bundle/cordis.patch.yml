# DSH Cloud overlay for the official dsh-web-app bundle.
# The local JSONL backend is removed rather than retained as a fallback: a
# Cloud Host must fail closed when PostgreSQL is unavailable.

- id: session-persistence-jsonl
  disabled: true

# The production Cloud profile never registers host-local filesystem or
# subprocess implementations. DSH tools keep their upstream contracts while
# these three providers move their effects into the Cube execution plane.
- id: subprocess
  disabled: true

- id: fs-sandbox
  disabled: true

- id: sandbox
  disabled: true

- insert:
    - id: cloud-run-context
      name: '@dsh-cloud/run-context'

    # Ordinary user Agents are process-resident only while active. Once their
    # turn is durably flushed, dispose the live handle so any healthy Worker can
    # cold-resume the next Run from the shared native Session log.
    - id: cloud-agent-residency
      name: '@dsh-cloud/agent-residency'

    - id: cloud-run-admission
      name: '@dsh-cloud/run-admission'
      config:
        connectionString: !!js process.env.DSH_CLOUD_DATABASE_URL
        namespace: !!js process.env.DSH_CLOUD_NAMESPACE ?? 'default'

    - id: cloud-execution-client
      name: '@dsh-cloud/execution-client'
      config:
        brokerUrl: !!js process.env.DSH_CLOUD_TOOL_BROKER_URL
        internalToken: !!js process.env.DSH_CLOUD_TOOL_BROKER_TOKEN
        requestTimeoutMs: 300000

    - id: cloud-subprocess
      name: '@dsh-cloud/subprocess-remote'

    - id: cloud-filesystem
      name: '@dsh-cloud/fs-remote'

    - id: cloud-sandbox
      name: '@dsh-cloud/sandbox-remote'

    # The active Session suffix and its low-latency projection are independent
    # Cordis capabilities. Deployments may replace Kafka or Valkey without
    # changing DSH's SessionPersistence implementation.
    - id: session-live-log-kafka
      name: '@dsh-cloud/session-live-kafka'
      config:
        brokers: !!js process.env.DSH_CLOUD_KAFKA_BROKERS
        topic: !!js process.env.DSH_CLOUD_KAFKA_SESSION_TOPIC ?? 'dsh-cloud-session-events-v2'
        clientId: dsh-cloud-worker

    - id: session-live-projection-valkey
      name: '@dsh-cloud/session-live-valkey'
      config:
        url: !!js process.env.DSH_CLOUD_VALKEY_URL
        retentionSeconds: !!js Number(process.env.DSH_CLOUD_LIVE_EVENT_RETENTION_SECONDS ?? '86400')

    - id: session-persistence-cloud
      name: '@dsh-cloud/session-persistence-tiered'
      config:
        connectionString: !!js process.env.DSH_CLOUD_DATABASE_URL
        namespace: !!js process.env.DSH_CLOUD_NAMESPACE ?? 'local'
        requireWriterAuthority: false
        validateControlAuthority: true
        attemptLeaseSeconds: !!js Number(process.env.DSH_CLOUD_RUN_LEASE_SECONDS ?? '20')
        maxPoolSize: 10
        writeBatchMaxDelayMs: 40
        liveLogPartitions: !!js Number(process.env.DSH_CLOUD_KAFKA_PARTITIONS ?? '12')
        liveLogReplicationFactor: !!js Number(process.env.DSH_CLOUD_KAFKA_REPLICATION_FACTOR ?? '1')
        liveLogRetentionMs: !!js Number(process.env.DSH_CLOUD_KAFKA_EVENT_RETENTION_MS ?? '2592000000')
